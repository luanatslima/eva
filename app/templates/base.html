{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Eva{% endblock %}</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 180px;
      background-color: rgb(86, 28, 36);
      color: rgb(232, 216, 196);
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 24px;
      border-bottom: 1px solid #ccc;
    }

    .logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    .titulo {
      font-size: 24px;
      color: rgb(232, 216, 196);
    }

    .nav-menu {
      padding: 16px;
      flex: 1;
    }

    .nav-menu ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .nav-menu li {
      margin-bottom: 12px;
    }

    .nav-menu a {
      display: block;
      padding: 12px 16px;
      border-radius: 8px;
      color: rgb(232, 216, 196);
      text-decoration: none;
      transition: background-color 0.3s, color 0.3s;
    }

    .nav-menu a:hover {
      background-color: #f3e8ff;
      color: #561C24;
    }

    .divisor {
      margin: 24px 0;
      border: none;
      border-top: 1px solid #ccc;
    }

    /* Conteúdo Principal */ 
    .main-content { 
        flex: 1; 
        padding: 40px; 
        overflow-y: auto; 
        display: flex; 
        flex-direction: column; 
        justify-content: space-between; 
    } 

    .welcome{
        color: white;
        padding: 20px;
        border-radius: 10px;;
    }

    .welcome h2 { 
        font-size: 32px; 
        color: white; 
        margin-bottom: 16px; 

    } .welcome p { 
        font-size: 18px; 
        color: white; 
    } 
        
    /* Rodapé */ 
    footer { 
        padding-top: 30px; 
        border-top: 1px solid #ccc; 
        color: #666; 
        font-size: 18px; 
        text-align: center; 
    }

    /* Carrossel */
    .carousel {
      margin-top: 0px;
      margin-bottom: 20px;
      position: relative;
    }

    .carousel-container {
      overflow: hidden;
      width: 100%;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .carousel-item {
      min-width: 100%;
      padding: 20px;
      background-color: #e8d8c4;
      color: #561C24;
      font-size: 22px;
      text-align: center;
      box-sizing: border-box;
      text-decoration: none;  
      display: block;      
      border: 2px solid #561C24;
      border-radius: 10px;  
    }

    .carousel-item:hover {
      cursor: pointer;
    }

    .carousel-item p {
      font-size: 15px;
      margin: 0px 30px 0px;;
    }

    .carousel-controls {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      transform: translateY(-50%);
    }

    .carousel-controls button {
      background-color: rgba(86, 28, 36, 0.8);
      color: white;
      border: none;
      padding: 12px;
      margin: 0px 10px;
      cursor: pointer;
      font-size: 18px;
      border-radius: 50%;
      transition: background-color 0.3s;
    }

    .carousel-controls button:hover {
      background-color: rgba(86, 28, 36, 1);
    }

    /* Logo Carrossel */
    .logo-area-carrossel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .logo-carrossel {
      width: 16%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    /* Carrossel em Blocos */
    .block-carousel {
      margin-top: 0px;
      margin-bottom: 40px;
    }

    .block-carousel h2 {
      font-size: 30px;
      color: #561C24;
      margin-bottom: 8px;
    }

    .block-carousel-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .block-carousel-container {
      overflow: hidden;
      width: 100%;
    }

    .block-carousel-track {
      display: flex;
      transition: transform 0.5s ease;
    }

    .block-item {
      flex: 0 0 25%;
      box-sizing: border-box;
      padding: 16px;          
      text-align: center;
      text-decoration: none;
      color: #561C24;
      background-color: #e8d8c4;
      transition: transform 0.3s;
      border: 2px solid #561C24;
      margin: 10px;
      border-radius: 10px;
      height: 190px;          
      display: flex;          
      flex-direction: column; 
      justify-content: space-between;
    }

    .block-item:hover {
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(86, 28, 36, 0.2);
    }

    .block-item img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .block-item p {
      font-size: 16px;
      font-weight: bold;
    }

    .block-prev,
    .block-next {
      background-color: rgba(86, 28, 36, 0.8);
      color: white;
      border: none;
      padding: 12px;
      cursor: pointer;
      font-size: 18px;
      border-radius: 50%;
      z-index: 1;
      transition: background-color 0.3s;
    }

    .block-prev:hover,
    .block-next:hover {
      background-color: rgba(86, 28, 36, 1);
      color: white;
    }

    .novo-portfolio {
      margin-top: 0px;
      margin-bottom: 40px;
    }

    .novo-portfolio h2 {
      font-size: 30px;
      color: #561C24;
      margin-bottom: 8px;
    }

    .busca {
      margin-bottom: 45px;
      text-align: center;
    }

    .search-input {
      background-color: #e8d8c4;
      width: 60%;
      padding: 12px 16px;
      font-size: 16px;
      border: 2px solid #561C24;
      border-radius: 8px 0 0 8px;
      outline: none;
    }

    .search-input::placeholder {
      color: rgba(86, 28, 36, 0.55);
    }

    .search-button {
      padding: 12px 20px;
      font-size: 16px;
      border: 2px solid #561C24;
      border-left: none;
      background-color: #561C24;
      color: #e8d8c4;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      transition: background-color 0.3s;
    }
  </style>
</head>

<body>
  <div class="container"> 
    <aside class="sidebar">
      <div class="logo-area">
        <img src="/static/img/logo-eva-2.png" alt="Logo Eva" class="logo">
      </div>
      <nav class="nav-menu">
        <ul class="nav-principal">
          <li><a href="{% url 'index' %}">Início</a></li>
          <li><a href="{% url 'portfolio' %}">Portfólio</a></li>
          <li><a href="#">Sobre</a></li>
        </ul>
        <hr class="divisor">
        <ul class="nav-secundaria">
          <li><a href="#">Clubes do Livro</a></li>
          <li><a href="#">Editoras</a></li>
          <li><a href="#">Livros</a></li>
        </ul>
        <hr class="divisor">
        <ul class="nav-secundaria">
          <li><a href="#">Configurações</a></li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <section class="busca">
        <input type="text" placeholder="Buscar autores, livros ou portfolios..." class="search-input">
        <button class="search-button">Buscar</button>
      </section>
      {% block content %}
      {% endblock %}
      <footer>
        <p>&copy; Eva 2026 - Plataforma Literária</p>
      </footer>
    </main>
  </div> 

  <script>
    // Carrossel 1
    (function() {
      const track = document.querySelector('.carousel-track');
      const items = document.querySelectorAll('.carousel-item');
      const prevBtn = document.querySelector('.prev');
      const nextBtn = document.querySelector('.next');

      // 1. Clonagem
      const firstClone = items[0].cloneNode(true);
      const lastClone = items[items.length - 1].cloneNode(true);
      
      track.appendChild(firstClone);
      track.prepend(lastClone);

      // 2. Variáveis de estado
      let index = 1; 
      let isTransitioning = false;
      const totalOriginalItems = items.length;

      // 3. Posicionamento Inicial
      track.style.transition = 'none';
      track.style.transform = `translateX(-${index * 100}%)`;

      function move() {
          if (isTransitioning) return;
          isTransitioning = true;
          track.style.transition = "transform 0.5s ease-in-out";
          track.style.transform = `translateX(-${index * 100}%)`;
      }

      nextBtn.addEventListener('click', () => {
          if (isTransitioning) return;
          index++;
          move();
      });

      prevBtn.addEventListener('click', () => {
          if (isTransitioning) return;
          index--;
          move();
      });

      track.addEventListener('transitionend', () => {
        isTransitioning = false;

        if (index === totalOriginalItems + 1) {
            track.style.transition = "none";
            index = 1;
            track.style.transform = `translateX(-${index * 100}%)`;
        }
        
        if (index === 0) {
            track.style.transition = "none";
            index = totalOriginalItems;
            track.style.transform = `translateX(-${index * 100}%)`;
        }
      });
    })();
  </script>

  <script>
    // Carrossel 2
    (function() {
      const track = document.querySelector('.block-carousel-track');
      const items = document.querySelectorAll('.block-item');
      const prevBtn = document.querySelector('.block-prev');
      const nextBtn = document.querySelector('.block-next');

      const visibleCount = 4; 
      const scrollStep = 3;
      let currentIndex = visibleCount; 

      for(let i = 0; i < visibleCount; i++) {
          const startClone = items[i].cloneNode(true);
          const endClone = items[items.length - 1 - i].cloneNode(true);
          track.appendChild(startClone);
          track.prepend(endClone);
      }

      function updatePosition(animate = true) {
          const itemWidth = items[0].offsetWidth + 20; 
          track.style.transition = animate ? 'transform 0.5s ease' : 'none';
          track.style.transform = `translateX(-${currentIndex * itemWidth}px)`;
      }

      window.addEventListener('load', () => updatePosition(false));

      nextBtn.addEventListener('click', () => {
          currentIndex += scrollStep;
          updatePosition();
      });

      prevBtn.addEventListener('click', () => {
          currentIndex -= scrollStep;
          updatePosition();
      });

      track.addEventListener('transitionend', () => {
          const itemWidth = items[0].offsetWidth + 20;
          // Se ultrapassar o final
          if (currentIndex >= items.length + visibleCount) {
              currentIndex = currentIndex - items.length;
              updatePosition(false);
          }
          // Se ultrapassar o início
          if (currentIndex < visibleCount) {
              currentIndex = currentIndex + items.length;
              updatePosition(false);
          }
      });

      window.addEventListener('resize', () => updatePosition(false));
    })();
  </script>

</body>
</html>
